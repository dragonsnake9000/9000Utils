plugins {
    id 'fabric-loom' version '1.9.2'
}

group = 'dev.dragonsnake9000'
version = '2.2.1'
base { archivesName = '9000utils-1.21.4' }
loom { mixin { defaultRefmapName = '9000utils-refmap.json' } }

repositories {
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
    mavenCentral()
}

// Local file dependencies avoid Loom 1.9's timestamped-SNAPSHOT remapping issue.
// Always download these exact published builds rather than a moving SNAPSHOT.
def pinnedJar = { String artifact, String revision ->
    def jar = file(".gradle/pinned-deps/${artifact}-${revision}.jar")
    if (!jar.exists()) {
        jar.parentFile.mkdirs()
        def url = "https://maven.meteordev.org/snapshots/meteordevelopment/${artifact}/1.21.4-SNAPSHOT/${artifact}-${revision}.jar"
        def temporary = new File(jar.parentFile, jar.name + '.part')
        new URI(url).toURL().withInputStream { input ->
            temporary.withOutputStream { output -> output << input }
        }
        java.nio.file.Files.move(temporary.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    return files(jar)
}
def meteorJar = pinnedJar('meteor-client', '1.21.4-20250408.145004-42')
def baritoneJar = pinnedJar('baritone', '1.21.4-20250105.184728-1')

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.7:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modCompileOnly 'net.fabricmc.fabric-api:fabric-api:0.111.0+1.21.4'
    modImplementation meteorJar
    implementation 'meteordevelopment:orbit:0.2.4'
    modImplementation baritoneJar
    include 'meteordevelopment:baritone:1.21.4-20250105.184728-1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test {
    useJUnitPlatform()
    systemProperty 'baritone.binary', baritoneJar.singleFile.absolutePath
}
jar {
    from('LICENSE', 'THIRD-PARTY-NOTICES.md')
    from('third-party/BARITONE-LICENSE') { into 'META-INF/licenses' }
}
